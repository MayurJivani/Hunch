# Push to public-hunt: build the image, push it to GHCR, tell Coolify to redeploy.
name: image
on:
  push:
    branches: [public-hunt]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.COOLIFY_WEBHOOK }}
      TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/mayurjivani/hunch:latest,ghcr.io/mayurjivani/hunch:${{ github.sha }}
      # The deploy webhook from the Coolify resource's Webhooks tab. forge.futile.studio
      # sits behind Cloudflare Access, so the call carries the CI service token too.
      - name: Redeploy
        if: env.URL != ''
        run: >-
          curl -fsS -H "Authorization: Bearer $TOKEN" -H "CF-Access-Client-Id: $CF_ID" -H "CF-Access-Client-Secret: $CF_SECRET" "$URL"
